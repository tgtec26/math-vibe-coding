<title>함수 탐험기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root {
    --paper: oklch(0.975 0.012 85);
    --paper-2: oklch(0.945 0.016 85);
    --ink: oklch(0.24 0.02 60);
    --ink-2: oklch(0.45 0.02 60);
    --rule: oklch(0.86 0.014 85);
    --accent: oklch(0.46 0.16 255);
    --accent-soft: oklch(0.9 0.05 255);
    --target: oklch(0.55 0.17 30);
    --ok: oklch(0.55 0.14 150);
    --grid: oklch(0.9 0.012 85);
    --axis: oklch(0.4 0.02 60);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: oklch(0.21 0.015 60); --paper-2: oklch(0.26 0.018 60);
      --ink: oklch(0.93 0.01 85); --ink-2: oklch(0.7 0.015 85); --rule: oklch(0.35 0.015 60);
      --accent: oklch(0.75 0.13 255); --accent-soft: oklch(0.32 0.06 255);
      --target: oklch(0.72 0.15 30); --ok: oklch(0.72 0.13 150);
      --grid: oklch(0.29 0.012 60); --axis: oklch(0.75 0.015 85);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: oklch(0.21 0.015 60); --paper-2: oklch(0.26 0.018 60);
    --ink: oklch(0.93 0.01 85); --ink-2: oklch(0.7 0.015 85); --rule: oklch(0.35 0.015 60);
    --accent: oklch(0.75 0.13 255); --accent-soft: oklch(0.32 0.06 255);
    --target: oklch(0.72 0.15 30); --ok: oklch(0.72 0.13 150);
    --grid: oklch(0.29 0.012 60); --axis: oklch(0.75 0.015 85);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: clamp(15px, 1.1vw, 18px); line-height: 1.5;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: clamp(16px, 3vw, 40px) clamp(16px, 3vw, 32px) 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px 24px; border-bottom: 2px solid var(--ink); padding-bottom: 12px; }
  h1 { font-family: "Gowun Batang", serif; font-weight: 700; font-size: clamp(28px, 3.4vw, 42px); margin: 0; letter-spacing: -0.01em; }
  .std { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .std span { font-size: 0.78em; padding: 2px 8px; border: 1px solid var(--rule); border-radius: 999px; color: var(--ink-2); }
  .tabs { display: flex; gap: 0; margin: 20px 0 0; border-bottom: 1px solid var(--rule); }
  .tabs button {
    background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 18px; margin-bottom: -1px;
    font: inherit; font-size: 1.05em; color: var(--ink-2); cursor: pointer; font-family: "Gowun Batang", serif; font-weight: 700;
  }
  .tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(280px, 0.9fr); gap: clamp(20px, 3vw, 44px); margin-top: 24px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  canvas { width: 100%; aspect-ratio: 1; display: block; background: var(--paper); border: 1px solid var(--rule); }
  .formula {
    font-family: "Gowun Batang", serif; font-size: clamp(30px, 3.2vw, 44px); font-weight: 700; margin: 0 0 18px;
    color: var(--accent); letter-spacing: 0.01em;
  }
  .formula i { font-style: italic; }
  .ctl { display: grid; grid-template-columns: 2.2em 1fr 3.4em; align-items: center; gap: 10px; margin: 8px 0 14px; }
  .ctl label { font-family: "Gowun Batang", serif; font-style: italic; font-size: 1.3em; text-align: right; }
  .ctl output { font-variant-numeric: tabular-nums; font-weight: 500; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
  .facts { border-top: 1px solid var(--rule); margin-top: 16px; padding-top: 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px 16px; }
  .facts b { display: block; font-size: 0.8em; color: var(--ink-2); font-weight: 500; }
  .facts span { font-size: 1.15em; font-variant-numeric: tabular-nums; }
  table { border-collapse: collapse; margin-top: 16px; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 5px 8px; text-align: center; border-bottom: 1px solid var(--rule); }
  th { font-weight: 500; color: var(--ink-2); font-size: 0.85em; }
  tr.head th { border-bottom: 2px solid var(--ink); font-family: "Gowun Batang", serif; font-style: italic; font-size: 1.1em; color: var(--ink); }
  .quest { margin-top: 28px; padding: 16px 18px; background: var(--paper-2); border-left: 4px solid var(--target); }
  .quest h2 { font-family: "Gowun Batang", serif; margin: 0 0 6px; font-size: 1.15em; }
  .quest p { margin: 0 0 10px; color: var(--ink-2); font-size: 0.95em; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button.btn { font: inherit; padding: 8px 14px; border: 1.5px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; border-radius: 4px; }
  button.btn.primary { background: var(--ink); color: var(--paper); }
  button.btn:hover { filter: brightness(1.08); }
  .msg { font-weight: 500; min-height: 1.5em; }
  .msg.ok { color: var(--ok); }
  .msg.no { color: var(--target); }
  .hint { color: var(--ink-2); font-size: 0.85em; margin-top: 10px; }
  .leg { display: flex; gap: 16px; font-size: 0.85em; color: var(--ink-2); margin-top: 8px; }
  .leg i { display: inline-block; width: 22px; height: 0; border-top: 3px solid var(--accent); vertical-align: middle; margin-right: 6px; }
  .leg i.t { border-top-style: dashed; border-color: var(--target); }
  .leg i.s { border-color: var(--ok); }
</style>

<div class="wrap">
  <header>
    <h1>함수 탐험기</h1>
    <div class="std"><span>9수02-15</span><span>9수02-16</span><span>9수02-22</span></div>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-mode="lin">일차함수 <i>y = ax + b</i></button>
    <button role="tab" aria-selected="false" data-mode="quad">이차함수 <i>y = a(x − p)² + q</i></button>
  </div>

  <div class="grid">
    <div>
      <canvas id="cv" width="700" height="700" aria-label="함수 그래프"></canvas>
      <div class="leg"><span><i></i>내 그래프</span><span id="legT" hidden><i class="t"></i>숨은 그래프</span><span id="legS"><i class="s"></i>기울기 삼각형</span></div>
    </div>

    <div>
      <p class="formula" id="formula"></p>
      <div id="controls"></div>
      <div class="facts" id="facts"></div>
      <table id="tbl"></table>

      <section class="quest">
        <h2>도전 · 숨은 그래프 맞히기</h2>
        <p>점선 그래프와 똑같아지도록 슬라이더를 움직인 뒤 확인을 누르세요.</p>
        <div class="row">
          <button class="btn primary" id="newQ">새 문제</button>
          <button class="btn" id="checkQ" disabled>확인</button>
          <span class="msg" id="msg"></span>
        </div>
      </section>
      <p class="hint">활동 예시: "기울기가 커지면 그래프는 어떻게 변할까?", "b만 바꾸면 무엇이 그대로일까?", 이차함수에서 "a의 부호와 최댓값·최솟값의 관계"를 말로 설명해 보기.</p>
    </div>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const R = 10; // 좌표 범위 -R..R
  const S = {
    mode: 'lin',
    lin: { a: 1, b: 0 },
    quad: { a: 1, p: 0, q: 0 },
    target: null,
  };
  const PARAMS = {
    lin: [
      { k: 'a', min: -5, max: 5, step: 0.5 },
      { k: 'b', min: -8, max: 8, step: 1 },
    ],
    quad: [
      { k: 'a', min: -3, max: 3, step: 0.25 },
      { k: 'p', min: -6, max: 6, step: 1 },
      { k: 'q', min: -6, max: 6, step: 1 },
    ],
  };
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const fmt = n => (Math.round(n * 100) / 100).toString().replace('-', '−');
  const f = (m, P, x) => m === 'lin' ? P.a * x + P.b : P.a * (x - P.p) ** 2 + P.q;

  // ---- 수식 표기 ----
  function formulaText(m, P) {
    if (m === 'lin') {
      let s = 'y = ';
      if (P.a === 0) return s + fmt(P.b);
      s += (P.a === 1 ? '' : P.a === -1 ? '−' : fmt(P.a)) + 'x';
      if (P.b > 0) s += ' + ' + fmt(P.b);
      if (P.b < 0) s += ' − ' + fmt(-P.b);
      return s;
    }
    let s = 'y = ' + (P.a === 1 ? '' : P.a === -1 ? '−' : fmt(P.a));
    s += P.p === 0 ? 'x²' : `(x ${P.p > 0 ? '−' : '+'} ${fmt(Math.abs(P.p))})²`;
    if (P.q > 0) s += ' + ' + fmt(P.q);
    if (P.q < 0) s += ' − ' + fmt(-P.q);
    return s;
  }

  // ---- 컨트롤 ----
  function buildControls() {
    const box = document.getElementById('controls');
    box.innerHTML = '';
    for (const p of PARAMS[S.mode]) {
      const row = document.createElement('div'); row.className = 'ctl';
      row.innerHTML = `<label for="r_${p.k}">${p.k}</label>
        <input type="range" id="r_${p.k}" min="${p.min}" max="${p.max}" step="${p.step}" value="${S[S.mode][p.k]}">
        <output id="o_${p.k}"></output>`;
      box.appendChild(row);
      row.querySelector('input').addEventListener('input', e => {
        let v = parseFloat(e.target.value);
        if (S.mode === 'quad' && p.k === 'a' && v === 0) { v = e.target.dataset.prev > 0 ? -0.25 : 0.25; e.target.value = v; }
        e.target.dataset.prev = v;
        S[S.mode][p.k] = v; render();
      });
    }
  }

  // ---- 표 ----
  function buildTable() {
    const P = S[S.mode];
    const xs = [-3, -2, -1, 0, 1, 2, 3];
    document.getElementById('tbl').innerHTML =
      `<tr class="head"><th>x</th>${xs.map(x => `<td>${fmt(x)}</td>`).join('')}</tr>
       <tr class="head"><th>y</th>${xs.map(x => `<td>${fmt(f(S.mode, P, x))}</td>`).join('')}</tr>`;
  }

  // ---- 성질 ----
  function buildFacts() {
    const P = S[S.mode], el = document.getElementById('facts');
    if (S.mode === 'lin') {
      el.innerHTML = `
        <div><b>기울기</b><span>${fmt(P.a)}</span></div>
        <div><b>y절편</b><span>${fmt(P.b)}</span></div>
        <div><b>x절편</b><span>${P.a === 0 ? (P.b === 0 ? '모든 x' : '없음') : fmt(-P.b / P.a)}</span></div>
        <div><b>x가 1 커지면 y는</b><span>${P.a === 0 ? '변화 없음' : (P.a > 0 ? fmt(P.a) + ' 증가' : fmt(-P.a) + ' 감소')}</span></div>`;
    } else {
      el.innerHTML = `
        <div><b>꼭짓점</b><span>(${fmt(P.p)}, ${fmt(P.q)})</span></div>
        <div><b>축의 방정식</b><span>x = ${fmt(P.p)}</span></div>
        <div><b>${P.a > 0 ? '최솟값' : '최댓값'}</b><span>${fmt(P.q)} (x = ${fmt(P.p)}일 때)</span></div>
        <div><b>볼록 방향</b><span>${P.a > 0 ? '아래로 볼록 (a > 0)' : '위로 볼록 (a < 0)'}</span></div>`;
    }
  }

  // ---- 그래프 ----
  function render() {
    const dpr = window.devicePixelRatio || 1;
    const W = cv.clientWidth || 700;
    if (cv.width !== W * dpr) { cv.width = W * dpr; cv.height = W * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, W);
    const u = W / (2 * R), X = x => W / 2 + x * u, Y = y => W / 2 - y * u;

    // 격자
    ctx.lineWidth = 1; ctx.strokeStyle = css('--grid');
    for (let i = -R; i <= R; i++) {
      ctx.beginPath(); ctx.moveTo(X(i), 0); ctx.lineTo(X(i), W); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, Y(i)); ctx.lineTo(W, Y(i)); ctx.stroke();
    }
    // 축
    ctx.strokeStyle = css('--axis'); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, Y(0)); ctx.lineTo(W, Y(0)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X(0), 0); ctx.lineTo(X(0), W); ctx.stroke();
    ctx.fillStyle = css('--ink-2'); ctx.font = `${Math.max(11, W / 52)}px "IBM Plex Sans KR", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (let i = -R + 2; i < R; i += 2) if (i) ctx.fillText(fmt(i), X(i), Y(0) + 4);
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (let i = -R + 2; i < R; i += 2) if (i) ctx.fillText(fmt(i), X(0) - 5, Y(i));
    ctx.font = `italic ${Math.max(14, W / 34)}px "Gowun Batang", serif`; ctx.fillStyle = css('--ink');
    ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillText('x', W - 8, Y(0) - 6);
    ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText('y', X(0) + 8, 6);

    const plot = (P, color, dash) => {
      ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = dash ? 2.5 : 3.5; ctx.setLineDash(dash ? [10, 8] : []);
      ctx.beginPath();
      for (let px = 0; px <= W; px += 2) {
        const x = (px - W / 2) / u, y = f(S.mode, P, x);
        const py = Y(y);
        if (py < -W || py > 2 * W) { ctx.moveTo(px, py); continue; }
        px === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.stroke(); ctx.restore();
    };
    if (S.target) plot(S.target, css('--target'), true);
    const P = S[S.mode];
    plot(P, css('--accent'), false);

    // 보조 표시
    ctx.fillStyle = css('--accent');
    const dot = (x, y, r = 6) => { ctx.beginPath(); ctx.arc(X(x), Y(y), r, 0, Math.PI * 2); ctx.fill(); };
    if (S.mode === 'lin') {
      dot(0, P.b);
      if (P.a !== 0) {
        // 기울기 삼각형: y절편에서 x로 1, y로 a
        ctx.save(); ctx.strokeStyle = css('--ok'); ctx.lineWidth = 2.5; ctx.fillStyle = css('--ok');
        ctx.beginPath(); ctx.moveTo(X(0), Y(P.b)); ctx.lineTo(X(1), Y(P.b)); ctx.lineTo(X(1), Y(P.b + P.a)); ctx.stroke();
        ctx.font = `${Math.max(12, W / 40)}px "IBM Plex Sans KR", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.fillText('1', X(0.5), Y(P.b) + 4);
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(fmt(P.a), X(1) + 6, Y(P.b + P.a / 2));
        ctx.restore();
      }
    } else {
      dot(P.p, P.q);
      ctx.save(); ctx.strokeStyle = css('--accent'); ctx.setLineDash([4, 6]); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(X(P.p), 0); ctx.lineTo(X(P.p), W); ctx.stroke(); ctx.restore();
    }

    document.getElementById('formula').textContent = formulaText(S.mode, P);
    for (const p of PARAMS[S.mode]) document.getElementById('o_' + p.k).textContent = fmt(P[p.k]);
    buildFacts(); buildTable();
  }

  // ---- 탭 ----
  document.querySelectorAll('.tabs button').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b === btn));
    S.mode = btn.dataset.mode; S.target = null; setMsg('');
    document.getElementById('legT').hidden = true; document.getElementById('legS').hidden = S.mode !== 'lin';
    document.getElementById('checkQ').disabled = true;
    buildControls(); render();
  }));

  // ---- 도전 ----
  const rnd = (min, max, step) => { const n = Math.round((max - min) / step); return min + step * Math.floor(Math.random() * (n + 1)); };
  const setMsg = (t, cls = '') => { const m = document.getElementById('msg'); m.textContent = t; m.className = 'msg ' + cls; };
  document.getElementById('newQ').addEventListener('click', () => {
    const T = {};
    for (const p of PARAMS[S.mode]) {
      do { T[p.k] = rnd(p.min, p.max, p.step); } while (S.mode === 'quad' && p.k === 'a' && T.a === 0);
    }
    const cur = S[S.mode];
    if (PARAMS[S.mode].every(p => T[p.k] === cur[p.k])) T[PARAMS[S.mode][0].k] += PARAMS[S.mode][0].step;
    S.target = T; document.getElementById('legT').hidden = false;
    document.getElementById('checkQ').disabled = false; setMsg('점선 그래프를 만들어 보세요.');
    render();
  });
  document.getElementById('checkQ').addEventListener('click', () => {
    if (!S.target) return;
    const cur = S[S.mode], T = S.target;
    const wrong = PARAMS[S.mode].filter(p => Math.abs(cur[p.k] - T[p.k]) > 1e-9);
    if (!wrong.length) {
      setMsg(`정답! ${formulaText(S.mode, T)}`, 'ok');
      S.target = null; document.getElementById('legT').hidden = true; document.getElementById('checkQ').disabled = true; render();
      return;
    }
    const hints = wrong.map(p => {
      const d = T[p.k] - cur[p.k];
      const name = S.mode === 'lin' ? { a: '기울기', b: 'y절편' }[p.k] : { a: '폭(a)', p: '축의 위치(p)', q: '꼭짓점 높이(q)' }[p.k];
      return `${name}을(를) ${d > 0 ? '더 크게' : '더 작게'}`;
    });
    setMsg('아직! ' + hints.join(', '), 'no');
  });

  buildControls(); render();
  new ResizeObserver(render).observe(cv);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
})();
</script>
